services:
  - type: web
    name: duo-tasks
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt "psycopg[binary]>=3.1.0"
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REVOLUT_WEBHOOK_SECRET
        sync: false
      - key: DUO_PIN
        sync: false
      - key: SHELLY_AUTH_KEY
        sync: false
      - key: SHELLY_SERVER_URI
        value: https://shelly-315-eu.shelly.cloud
      - key: SHELLY_HEATING_DEVICE_ID
        value: 80b54e3be384
